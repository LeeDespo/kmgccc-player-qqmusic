[package]
name = "qqmusic-helper-next"
version = "0.1.0"
edition = "2021"
description = "HelperNext: the QQ Music online source's data component (all reads and the login, no Python)"

[[bin]]
name = "qqmusic-helper-next"
path = "src/main.rs"

[dependencies]
# Blocking HTTP with rustls: the component answers one JSON line at a time, so
# an async runtime would buy nothing and would triple the dependency surface.
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
